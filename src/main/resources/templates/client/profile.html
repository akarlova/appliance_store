<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{client.profile.title}">Мой профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>

<!-- Навигация -->
<div th:insert="~{menunavy :: navy}"></div>

<div class="container mt-4">
    <h1 th:text="#{client.profile.title}">Мой профиль</h1>

    <form th:action="@{/clients/profile}"
          th:object="${profile}"
          method="post"
          class="mt-3">

        <!-- Имя -->
        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{object.user.name}">Имя</label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"
                 class="text-danger"></div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label" th:text="#{object.user.email}">Email</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 class="text-danger"></div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{object.user.password}">Пароль</label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"
                 class="text-danger"></div>
        </div>

        <!-- Карта (только для чтения) -->
        <div class="mb-3">
            <label for="card" class="form-label" th:text="#{object.client.card}">Карта</label>
            <input type="text"
                   id="card"
                   th:field="*{card}"
                   class="form-control"
                   readonly/>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="#{action.save}">Сохранить</button>
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{action.cancel}">Отмена</a>
    </form>
</div>

<!-- Футер -->
<div th:insert="~{footer :: footer}"></div>

</body>
</html>
