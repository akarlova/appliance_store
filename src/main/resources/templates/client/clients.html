<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Clients list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-4">
    <h1 th:text="#{client.header.list}">Clients List</h1>
    <table class="table table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th th:text="#{object.user.id}">ID</th>
            <th th:text="#{object.user.name}">Name</th>
            <th th:text="#{object.user.email}">Email</th>
            <th th:text="#{object.user.password}">Password</th>
            <th th:text="#{object.client.card}">Card</th>
            <th>Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.id}"></td>
            <td th:text="${client.name}"></td>
            <td th:text="${client.email}"></td>
            <td th:text="${client.password}"></td>
            <td th:text="${client.card}"></td>
            <td>
                <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="me-2" title="#{action.edit}">
                    <i class="fa fa-pencil"></i>
                </a>
                <a th:href="@{/clients/{id}/delete(id=${client.id})}" title="#{action.delete}">
                    <i class="fa fa-minus"></i>
                </a>
            </td>
            <td sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
                <a th:href="@{/orders/client/{clientId}/cart(clientId=${client.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Create Order
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/clients/new}" class="btn btn-primary" th:text="#{client.btn.new}">New Client</a>
</div>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
