<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{client.register.title}">Client Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- Общая навигация -->
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-4">
    <h1 th:text="#{client.register.title}">Client Registration</h1>
    <form th:action="@{/clients/register}" th:object="${registration}" method="post" novalidate class="mt-3">

        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{object.user.name}">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"/>
            <div th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"
                 class="text-danger"></div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label" th:text="#{object.user.email}">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"/>
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 class="text-danger"></div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{object.user.password}">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"/>
            <div th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"
                 class="text-danger"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary" th:text="#{action.save}">Register</button>
        <a th:href="@{/login}" class="btn btn-link" th:text="#{action.login}">Login</a>
    </form>
</div>

<!-- Общий футер -->
<div th:insert="~{footer::footer}"></div>
</body>
</html>
