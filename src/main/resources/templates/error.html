<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Error ' + ${status}">Error</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"/>
</head>
<body class="container mt-5">
<div class="alert alert-danger">
    <h1 th:text="'Error ' + ${status}">Error</h1>
    <img th:src="@{/images/stupid_kitty.jpg}"
         alt="Stupid Kitty"
         class="img-fluid mb-3"
         style="max-width: 300px;"/>
    <p th:text="${error}">Something went wrong</p>
    <div th:if="${message}">
        <small th:text="${message}">— details</small>
    </div>
    <a th:href="@{/}" class="btn btn-primary mt-3">Go Home</a>
</div>
</body>
</html>
