<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{appliance.header.new}">New Appliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{appliance.header.new}">New Appliance</h1>
    <form th:action="@{/appliances}" th:object="${appliance}" method="post">
        <div class="mb-3">
            <label th:text="#{object.appliance.name}">Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.category}">Category</label>
            <select class="form-select" th:field="*{category}">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
            <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.model}">Model</label>
            <input type="text" class="form-control" th:field="*{model}"/>
            <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.manufacturer}">Manufacturer</label>
            <select class="form-select" th:field="*{manufacturerId}">
                <option th:each="m : ${manufacturers}"
                        th:value="${m.id}" th:text="${m.name}"></option>
            </select>
            <div th:if="${#fields.hasErrors('manufacturerId')}" th:errors="*{manufacturerId}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.powerType}">Power Type</label>
            <select class="form-select" th:field="*{powerType}">
                <option th:each="p : ${powerTypes}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div th:if="${#fields.hasErrors('powerType')}" th:errors="*{powerType}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.characteristic}">Characteristic</label>
            <input type="text" class="form-control" th:field="*{characteristic}"/>
            <div th:if="${#fields.hasErrors('characteristic')}" th:errors="*{characteristic}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.description}">Description</label>
            <input type="text" class="form-control" th:field="*{description}"/>
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.power}">Power</label>
            <input type="number" class="form-control" th:field="*{power}"/>
            <div th:if="${#fields.hasErrors('power')}" th:errors="*{power}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label th:text="#{object.appliance.price}">Price</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}"/>
            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{action.save}">Save</button>
        <a th:href="@{/appliances}" class="btn btn-secondary" th:text="#{action.cancel}">Cancel</a>
    </form>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
