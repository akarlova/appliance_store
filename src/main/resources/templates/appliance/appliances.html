<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{appliance.header.list}">Appliances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-4">
    <h1 th:text="#{appliance.header.list}">Appliances</h1>

    <!-- Search form -->
    <form th:action="@{/appliances(orderId=${currentOrderId}, query=${query})}"
          method="get"
          class="d-flex mb-3">
        <input type="text"
               name="query"
               class="form-control me-2"
               th:placeholder="#{home.searchPlaceholder}"
               th:value="${query}" />
        <button class="btn btn-outline-primary" type="submit">🔍</button>
    </form>

    <!-- Table -->
    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <!-- Сортировка по ID -->
            <th>
                <a th:href="@{/appliances(
                              orderId=${currentOrderId},
                              query=${query},
                              page=0,
                              size=${page.size},
                              sort='id,asc'
                          )}"
                   th:text="#{object.appliance.id}">ID</a>
            </th>
            <!-- Сортировка по Name -->
            <th>
                <a th:href="@{/appliances(
                              orderId=${currentOrderId},
                              query=${query},
                              page=0,
                              size=${page.size},
                              sort='name,asc'
                          )}"
                   th:text="#{object.appliance.name}">Name</a>
            </th>
            <!-- Сортировка по Manufacturer -->
            <th>
                <a th:href="@{/appliances(
                              orderId=${currentOrderId},
                              query=${query},
                              page=0,
                              size=${page.size},
                              sort='manufacturer.name,asc'
                          )}"
                   th:text="#{object.appliance.manufacturer}">Manufacturer</a>
            </th>
            <th th:text="#{object.appliance.category}">Category</th>
            <th th:text="#{object.appliance.model}">Model</th>
            <th th:text="#{object.appliance.powerType}">Power Type</th>
            <th th:text="#{object.appliance.characteristic}">Characteristic</th>
            <th th:text="#{object.appliance.description}">Description</th>
            <!-- Сортировка по Power -->
            <th>
                <a th:href="@{/appliances(
                              orderId=${currentOrderId},
                              query=${query},
                              page=0,
                              size=${page.size},
                              sort='power,asc'
                          )}"
                   th:text="#{object.appliance.power}">Power</a>
            </th>
            <!-- Сортировка по Price -->
            <th>
                <a th:href="@{/appliances(
                              orderId=${currentOrderId},
                              query=${query},
                              page=0,
                              size=${page.size},
                              sort='price,asc'
                          )}"
                   th:text="#{object.appliance.price}">Price</a>
            </th>
            <th th:text="#{object.operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${page.content}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.name}">Name</td>
            <td th:text="${a.manufacturer.name}">ACME</td>
            <td th:text="${a.category}">BIG</td>
            <td th:text="${a.model}">X1000</td>
            <td th:text="${a.powerType}">AC220</td>
            <td th:text="${a.characteristic}">Specs</td>
            <td th:text="${a.description}">Desc</td>
            <td th:text="${a.power}">500</td>
            <td th:text="${#numbers.formatDecimal(a.price,1,'COMMA',2,'POINT')} + ' $'">100.00 $</td>
            <td>
                        <span sec:authorize="hasAnyRole('CLIENT','EMPLOYEE','ADMIN')"
                              th:if="${currentOrderId != null}">
                          <form th:action="@{/orders/{orderId}/rows(orderId=${currentOrderId})}"
                                method="post" style="display:inline-block;">
                            <input type="hidden" name="applianceId" th:value="${a.id}" />
                            <input type="hidden" name="quantity" value="1" />
                            <button type="submit"
                                    class="btn btn-sm btn-outline-success"
                                    th:text="#{orders.btn.addToCart}">
                              Add to Order
                            </button>
                          </form>
                        </span>
                <span sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
                          <a th:href="@{/appliances/{id}/edit(id=${a.id})}"
                             class="btn btn-sm btn-outline-primary"
                             th:text="#{action.edit}">Edit</a>
                          <a th:href="@{/appliances/{id}/delete(id=${a.id})}"
                             class="btn btn-sm btn-outline-danger"
                             th:text="#{action.delete}">Delete</a>
                        </span>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/appliances(
                             orderId=${currentOrderId},
                             query=${query},
                             page=${page.number - 1},
                             size=${page.size},
                             sort=${page.sort}
                          )}">
                    &laquo;
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/appliances(
                             orderId=${currentOrderId},
                             query=${query},
                             page=${i},
                             size=${page.size},
                             sort=${page.sort}
                          )}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/appliances(
                             orderId=${currentOrderId},
                             query=${query},
                             page=${page.number + 1},
                             size=${page.size},
                             sort=${page.sort}
                          )}">
                    &raquo;
                </a>
            </li>
        </ul>
    </nav>

    <!-- New Appliance -->
    <div sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
        <a th:href="@{/appliances/new}"
           class="btn btn-primary mt-3"
           th:text="#{appliance.btn.new}">New Appliance</a>
    </div>
</div>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
