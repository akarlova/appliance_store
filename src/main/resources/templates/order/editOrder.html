<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.header.edit}">Edit Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{orders.header.edit}">Edit Order</h1>

    <form th:action="@{/orders/{id}(id=${order.id})}"
          th:object="${order}"
          method="post">

        <div class="mb-3">
            <label for="id" class="form-label" th:text="#{object.order.id}">ID</label>
            <input type="text"
                   id="id"
                   class="form-control"
                   th:field="*{id}"
                   readonly/>
        </div>

        <div class="mb-3" sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
            <label for="clientId" class="form-label"
                   th:text="#{object.order.client}">Client</label>
            <select id="clientId"
                    class="form-select"
                    th:field="*{clientId}">
                <option th:each="c : ${clients}"
                        th:value="${c.id}"
                        th:text="${c.name}">Client</option>
            </select>
            <div th:if="${#fields.hasErrors('clientId')}"
                 th:errors="*{clientId}"
                 class="text-danger"></div>
        </div>

        <div class="mb-3" sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
            <label for="employeeId" class="form-label"
                   th:text="#{object.order.employee}">Employee</label>
            <select id="employeeId"
                    class="form-select"
                    th:field="*{employeeId}">
                <option th:each="e : ${employees}"
                        th:value="${e.id}"
                        th:text="${e.name}">Employee</option>
            </select>
            <div th:if="${#fields.hasErrors('employeeId')}"
                 th:errors="*{employeeId}"
                 class="text-danger"></div>
        </div>

        <div class="mt-4">
            <button type="submit"
                    class="btn btn-primary"
                    th:text="#{action.update}">Update</button>
            <a th:href="@{/orders}"
               class="btn btn-secondary"
               th:text="#{action.cancel}">Cancel</a>
        </div>

    </form>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
