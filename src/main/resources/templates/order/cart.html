<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.header.cart}">Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{orders.header.cart}">Shopping Cart</h1>

    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th th:text="#{object.appliance.id}">ID</th>
            <th th:text="#{object.appliance.name}">Name</th>
            <th th:text="#{object.quantity}">Quantity</th>
            <th th:text="#{object.amount}">Amount</th>
            <th th:text="#{object.operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${order.orderRows}">
            <td th:text="${row.applianceId}">1</td>
            <td th:text="${row.applianceName}">Claw</td>

            <!-- обновление количества -->
            <td>
                <form th:action="@{/orders/{orderId}/rows/{rowId}(orderId=${order.id},rowId=${row.id})}"
                      method="post" style="display:inline-block">
                    <input type="number"
                           name="quantity"
                           th:value="${row.number}"
                           min="1"
                           class="form-control form-control-sm"
                           style="width:3em"
                           onchange="this.form.submit()"/>
                </form>
            </td>

            <!-- Сумма строки: формат + замена запятой на точку -->
            <td th:text="${#strings.replace(#numbers.formatDecimal(row.amount,0,2), ',', '.')}">
                0.00
            </td>

            <!-- удаление строки -->
            <td>
                <a th:href="@{/orders/{orderId}/rows/{rowId}/delete(orderId=${order.id},rowId=${row.id})}"
                   class="btn btn-sm btn-outline-danger"
                   th:text="#{action.delete}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mb-3">
        <strong th:text="#{orders.label.total}">Total:</strong>
        <span th:text="${#strings.replace(#numbers.formatDecimal(order.totalAmount,0,2), ',', '.')}">
            0.00
        </span>
    </div>
    <div class="mb-3">
        <strong th:text="#{orders.label.bonus}">Bonus (5%):</strong>
        <span th:text="${#strings.replace(#numbers.formatDecimal(bonus,0,2), ',', '.')}">
            0.00
        </span>
    </div>

    <div class="d-flex gap-2 mb-4">
        <!-- Continue Shopping возвращаем на /appliances с orderId -->
        <a th:href="@{/appliances(orderId=${order.id})}"
           class="btn btn-secondary"
           th:text="#{orders.btn.continue}">Continue Shopping</a>

        <!-- CLIENT → Checkout → thankYou -->
        <form th:action="@{/orders/{orderId}/confirm(orderId=${order.id})}"
              sec:authorize="hasRole('CLIENT')"
              method="post">
            <button type="submit"
                    class="btn btn-success"
                    th:text="#{orders.btn.checkout}">Checkout</button>
        </form>
        <!-- EMPLOYEE/ADMIN → Submit → список заказов -->
        <form th:action="@{/orders/{orderId}/submit(orderId=${order.id})}"
              sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')"
              method="post">
            <button type="submit"
                    class="btn btn-primary"
                    th:text="#{orders.btn.submit}">Submit</button>
        </form>
        <!-- Cancel → список заказов -->
        <a th:href="@{/orders/{orderId}/cart/cancel(orderId=${order.id})}"
           class="btn btn-outline-secondary"
           th:text="#{action.cancel}">Cancel</a>
    </div>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
