<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.header.new}">New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{orders.header.new}">New Order</h1>
    <form th:action="@{/orders}"
          th:object="${order}"
          method="post">

        <!-- Сотрудник выбирает CLIENT -->
        <div class="mb-3"
             sec:authorize="hasRole('EMPLOYEE')">
            <label for="clientId" class="form-label"
                   th:text="#{object.order.client}">Client</label>
            <select id="clientId"
                    th:field="*{clientId}"
                    class="form-select">
                <option th:each="c : ${clients}"
                        th:value="${c.id}"
                        th:text="${c.name} + ' (' + c.email + ')'">
                    Клиент
                </option>
            </select>
        </div>

        <!-- Клиент этого не видит, его clientId уже проставлен в контроллере -->

        <button type="submit"
                class="btn btn-primary"
                th:text="#{action.save}">Save</button>
        <a th:href="@{/orders}"
           class="btn btn-secondary"
           th:text="#{action.cancel}">Cancel</a>
    </form>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
