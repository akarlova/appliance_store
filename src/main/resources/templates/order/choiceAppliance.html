<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.header.chooseAppliance}">Choose Appliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{orders.header.chooseAppliance}">Choose Appliance</h1>

    <div th:each="a : ${appliances}" class="mb-2 row g-2 align-items-center">

        <!-- Только для CLIENT: добавление в корзину -->
        <span sec:authorize="hasRole('CLIENT')" class="col-12">
        <form th:action="@{/orders/{orderId}/rows(orderId=${order.id})}"
              method="post"
              class="row g-2 align-items-center">

          <input type="hidden" name="applianceId" th:value="${a.id}"/>

          <div class="col-auto" th:text="${a.name}">Name</div>

          <div class="col-auto">
            <input name="quantity"
                   type="number"
                   min="1"
                   value="1"
                   class="form-control"/>
          </div>

          <div class="col-auto">
            <button type="submit"
                    class="btn btn-success"
                    th:text="#{orders.btn.addToCart}">Add to cart</button>
          </div>
        </form>
      </span>

        <!-- Для сотрудников/админов, если нужно сохранять сразу порядок -->
        <span sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')" class="col-12">
        <form th:action="@{/orders/{orderId}/rows(orderId=${order.id})}"
              method="post"
              class="row g-2 align-items-center">

          <input type="hidden" name="applianceId" th:value="${a.id}"/>

          <div class="col-auto" th:text="${a.name}">Name</div>

          <div class="col-auto">
            <input name="quantity"
                   type="number"
                   min="1"
                   value="1"
                   class="form-control"/>
          </div>

          <div class="col-auto">
            <button type="submit"
                    class="btn btn-primary"
                    th:text="#{orders.btn.addRow}">Add</button>
          </div>
        </form>
      </span>

    </div>

    <a th:href="@{/orders}" class="btn btn-secondary"
       th:text="#{action.back}">Back to orders</a>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
