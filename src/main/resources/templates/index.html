<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{home.title}">Appliance Store — Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<!-- navbar -->
<div th:insert="~{menunavy::navy}"></div>

<main class="container mt-5">
    <h1 th:text="#{home.title}">Welcome to Appliance Store</h1>
    <p class="lead" th:text="#{home.subtitle}">
        Your one-stop place for managing appliances, orders, clients and more.
    </p>

    <div class="d-flex mb-4 align-items-center">
        <img th:src="@{/images/puffin-sign.jpg}"
             alt="Puffin Shop Logo"
             style="width:8%; height:auto;" />
        <form th:action="@{/}" method="get" class="d-flex ms-3">
            <input type="text"
                   name="query"
                   class="form-control me-2"
                   th:placeholder="#{home.searchPlaceholder}"
                   th:value="${query}"
                   style="width:400px;" />
            <button class="btn btn-outline-primary" type="submit">🔍</button>
        </form>
    </div>

    <hr/>

    <div class="d-flex mb-5 align-items-center">
        <a class="btn btn-outline-primary me-3"
           th:href="@{/appliances}"
           th:text="#{actions.browseAppliances}">
            Browse Appliances
        </a>
        <img th:src="@{/images/brand-collage.jpg}"
             alt="Brand Collage"
             style="width:8%; height:auto;" />
    </div>

    <hr class="my-5"/>

    <section>
        <h2 th:text="#{home.latestProducts}">Latest Products</h2>
        <div class="row">
            <div class="col-md-3 mb-4"
                 th:each="appl : ${appliancePage.content}">
                <div class="card h-100">
                    <img th:src="@{|https://via.placeholder.com/300x200?text=${appl.name}|}"
                         class="card-img-top"
                         th:alt="${appl.name}" />
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${appl.name}">Product Name</h5>
                        <p class="card-subtitle mb-2 text-muted"
                           th:text="${appl.manufacturer.name}">Manufacturer Name</p>
                        <p class="card-text text-truncate"
                           th:text="${appl.description}">Description…</p>
                        <div class="mt-auto">
                            <p class="h5"
                               th:text="${#numbers.formatDecimal(appl.price,1,'COMMA',2,'POINT')} + ' $'">
                                0.00 $
                            </p>
                            <form sec:authorize="hasRole('CLIENT')"
                                  th:action="@{/orders/{orderId}/rows(orderId=${currentOrderId})}"
                                  method="post">
                                <input type="hidden" name="applianceId" th:value="${appl.id}" />
                                <input type="hidden" name="quantity" value="1" />
                                <button type="submit"
                                        class="btn btn-primary w-100"
                                        th:text="#{actions.addToCart}">
                                    Add to Cart
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${appliancePage.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/(query=${query}, page=${appliancePage.number - 1})}">
                        «
                    </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, appliancePage.totalPages - 1)}"
                    th:classappend="${i == appliancePage.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/(query=${query}, page=${i})}"
                       th:text="${i + 1}">
                        1
                    </a>
                </li>
                <li class="page-item" th:classappend="${appliancePage.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/(query=${query}, page=${appliancePage.number + 1})}">
                        »
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</main>

<!-- footer -->
<div th:insert="~{footer::footer}"></div>
</body>
</html>
