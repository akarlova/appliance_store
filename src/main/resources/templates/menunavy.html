<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navy" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Appliance Store</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Public: Appliances & Manufacturers -->
                <li class="nav-item" sec:authorize="permitAll">
                    <a class="nav-link" th:href="@{/appliances}"
                       th:text="#{appliances.menu.name}">Appliances</a>
                </li>
                <li class="nav-item" sec:authorize="permitAll">
                    <a class="nav-link" th:href="@{/manufacturers}"
                       th:text="#{manufacturers.menu.name}">Manufacturers</a>
                </li>

                <!-- CLIENT, EMPLOYEE, ADMIN: Orders -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/orders}"
                       th:text="#{order.menu.name}">Orders</a>
                </li>

                <!-- EMPLOYEE & ADMIN: Clients -->
                <li class="nav-item" sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
                    <a class="nav-link" th:href="@{/clients}"
                       th:text="#{clients.menu.name}">Clients</a>
                </li>

                <!-- ADMIN only: Employees -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/employees}"
                       th:text="#{employees.menu.name}">Employees</a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Log in</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/clients/register}">Register</a>
                </li>

                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa fa-user"></i> <span th:text="${#authentication.name}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li><a class="dropdown-item" th:href="@{/clients/profile}">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display:inline">
                                <button type="submit" class="dropdown-item">Log out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/(lang='en')}"
                       th:text="'EN'">
                        EN
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/(lang='uk')}"
                       th:text="'UA'">
                        UA
                    </a>
                </li>
            </ul>
            <!-- Logout for all authenticated -->
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-outline-light btn-sm"
                                th:text="#{menu.logout}">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
