<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{manufacturer.header.list}">Manufacturers List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{manufacturer.header.list}">Manufacturers List</h1>
    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th th:text="#{object.manufacturer.id}">ID</th>
            <th th:text="#{object.manufacturer.name}">Name</th>
            <th sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')" th:text="#{object.operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${manufacturers}">
            <td th:text="${m.id}">1</td>
            <td th:text="${m.name}">Samsung</td>

            <td>
  <span sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
    <a th:href="@{/manufacturers/{id}/edit(id=${m.id})}"
       class="btn btn-sm btn-outline-primary">✎</a>
    <a th:href="@{/manufacturers/{id}/delete(id=${m.id})}"
       class="btn btn-sm btn-outline-danger">✖</a>
  </span>
            </td>
        </tr>
        </tbody>
    </table>
    <div sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')">
        <a th:href="@{/manufacturers/new}"
           class="btn btn-primary"
           th:text="#{manufacturer.btn.new}">New Manufacturer</a>
    </div>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
