<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{manufacturer.header.edit}">Edit Manufacturer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{manufacturer.header.edit}">Edit Manufacturer</h1>
    <form th:action="@{|/manufacturers/${manufacturer.id}|}"
          th:object="${manufacturer}"
          method="post">
        <div class="mb-3">
            <label th:for="name" class="form-label"
                   th:text="#{object.manufacturer.name}">Name</label>
            <input type="text" id="name" th:field="*{name}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"
                 class="text-danger"></div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary"
                    th:text="#{action.update}">Update</button>
            <a th:href="@{/manufacturers}" class="btn btn-secondary"
               th:text="#{action.cancel}">Cancel</a>
        </div>
    </form>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
