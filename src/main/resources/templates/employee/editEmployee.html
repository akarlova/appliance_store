<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"/>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <title th:text="#{employee.header.edit}">Edit Employee</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{employee.header.edit}">Edit Employee</h1>
    <form th:action="@{|/employees/${employee.id}|}"
          th:object="${employee}"
          method="post">

        <div class="mb-3">
            <label for="name" class="form-label"
                   th:text="#{object.user.name}">Name</label>
            <input type="text" id="name" th:field="*{name}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label"
                   th:text="#{object.user.email}">Email</label>
            <input type="email" id="email" th:field="*{email}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label"
                   th:text="#{object.user.password}">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="department" class="form-label"
                   th:text="#{object.employee.department}">Department</label>
            <input type="text" id="department" th:field="*{department}"
                   class="form-control"/>
            <div th:if="${#fields.hasErrors('department')}"
                 th:errors="*{department}" class="text-danger"></div>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="#{action.update}">Update</button>
        <a th:href="@{/employees}"
           class="btn btn-secondary"
           th:text="#{action.cancel}">Cancel</a>
    </form>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
