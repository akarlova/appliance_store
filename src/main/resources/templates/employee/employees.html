<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"/>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <title th:text="#{employee.header.list}">Employees list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{employee.header.list}">Employees</h1>
    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th th:text="#{object.user.id}">ID</th>
            <th th:text="#{object.user.name}">Name</th>
            <th th:text="#{object.user.email}">Email</th>
            <th th:text="#{object.user.password}">Password</th>
            <th th:text="#{object.employee.department}">Department</th>
            <th th:text="#{object.operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">1</td>
            <td th:text="${emp.name}">Name</td>
            <td th:text="${emp.email}">email@</td>
            <td th:text="${emp.password}">••••••</td>
            <td th:text="${emp.department}">Dept</td>
            <td>
                <a th:href="@{/employees/{id}/edit(id=${emp.id})}"
                   class="btn btn-sm btn-outline-primary"
                   th:text="#{action.edit}">Edit</a>
                <a th:href="@{/employees/{id}/delete(id=${emp.id})}"
                   class="btn btn-sm btn-outline-danger"
                   th:text="#{action.delete}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/employees/new}"
       class="btn btn-primary"
       th:text="#{employee.btn.new}">New Employee</a>
</div>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
